name: update Backsmith

on:
  schedule:
    - cron: "31 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update manifest from the latest release
        shell: bash
        run: |
          set -euo pipefail
          release=$(curl -fsSL https://api.github.com/repos/SanketKudale/backsmith/releases/latest)
          version=$(jq -r '.tag_name | ltrimstr("v")' <<<"$release")
          url="https://github.com/SanketKudale/backsmith/releases/download/v${version}/backsmith.zip"
          curl -fsSL "$url" -o backsmith.zip
          sha=$(sha256sum backsmith.zip | cut -d' ' -f1)
          jq --arg version "$version" --arg url "$url" --arg hash "$sha" \
            '.version=$version | .url=$url | .hash=$hash | .extract_dir=("backsmith-"+$version)' \
            bucket/backsmith.json > bucket/backsmith.json.tmp
          mv bucket/backsmith.json.tmp bucket/backsmith.json
          rm backsmith.zip
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bucket/backsmith.json
          git commit -m "Update Backsmith to ${version}"
          git push